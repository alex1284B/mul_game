<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Математичко Авантура v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
       /* ============================================================
           OCEAN MAP — design tokens
           ============================================================ */
        :root {
            /* sky / sea */
            --sky-1: #eaf8ff; --sky-2: #d5efff; --sky-3: #bde6fb;
            --sea-1: #6fcee9; --sea-2: #38a8d8; --sea-3: #1f83b6; --sea-deep: #0d5c88;
            --foam: rgba(255, 255, 255, 0.55);
            /* surfaces */
            --card: #ffffff; --card-2: #f4fafd; --line: rgba(10, 51, 72, 0.10);
            /* type + accents */
            --ink: #0a3348; --muted: #5d7f92;
            --accent: #0f9bd0; --accent-dark: #087aa8; --coral: #ff7a59;
            --success: #12b886; --error: #e8483f; --gold: #ffc23d;
            /* islands: a journey from sand to gold */
            --isle-0: #ffd166; --isle-1: #ff9e6d; --isle-2: #ff7a9c; --isle-3: #e56bd0;
            --isle-4: #b18cff; --isle-5: #7aa2ff; --isle-6: #4cc9f0; --isle-7: #2fd6b0;
            --isle-8: #9be15d; --isle-9: #ffc23d;
            /* shape language */
            --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
            --shadow-sm: 0 2px 6px rgba(10, 51, 72, 0.10);
            --shadow: 0 12px 28px rgba(10, 51, 72, 0.14);
            --shadow-lg: 0 26px 64px rgba(10, 51, 72, 0.24);
            --font-display: 'Comfortaa', 'Segoe UI', system-ui, sans-serif;
            --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        }

        * { box-sizing: border-box; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; color: var(--ink); font-family: var(--font-body);
            min-height: 100vh; padding: 18px; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 46%, var(--sky-3) 100%);
            overflow-x: hidden; font-variant-numeric: tabular-nums;
        }

        /* ---------- animated sky / sea backdrop ---------- */
        #backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        #backdrop .sun {
            position: absolute; top: -70px; right: -50px; width: 260px; height: 260px; border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 229, 160, .95), rgba(255, 214, 120, .35) 55%, transparent 70%);
        }
        #backdrop .cloud {
            position: absolute; height: 42px; border-radius: 40px; background: rgba(255, 255, 255, .82);
            filter: blur(.3px); box-shadow: 0 10px 24px rgba(10, 51, 72, .07);
        }
        #backdrop .cloud::before, #backdrop .cloud::after {
            content: ''; position: absolute; background: inherit; border-radius: 50%;
        }
        #backdrop .cloud::before { width: 58%; height: 165%; left: 12%; top: -78%; }
        #backdrop .cloud::after  { width: 42%; height: 128%; right: 14%; top: -52%; }
        #backdrop .c1 { width: 150px; top: 12%; left: -170px; animation: drift 68s linear infinite; }
        #backdrop .c2 { width: 110px; top: 26%; left: -170px; animation: drift 92s linear infinite 14s; opacity: .8; }
        #backdrop .c3 { width: 190px; top: 5%;  left: -210px; animation: drift 118s linear infinite 38s; opacity: .65; }
        @keyframes drift { to { transform: translateX(calc(100vw + 260px)); } }
        #backdrop .sea {
            position: absolute; left: 0; right: 0; bottom: 0; height: 26vh; min-height: 130px;
            background: linear-gradient(180deg, rgba(111, 206, 233, .0), rgba(56, 168, 216, .38) 42%, rgba(31, 131, 182, .5));
        }
        #backdrop .wave { position: absolute; left: -50%; width: 200%; height: 70px; opacity: .5; }
        #backdrop .w1 { bottom: 20vh; animation: swell 15s ease-in-out infinite; }
        #backdrop .w2 { bottom: 13vh; opacity: .35; animation: swell 21s ease-in-out infinite reverse; }
        @keyframes swell { 0%,100% { transform: translateX(0) } 50% { transform: translateX(4%) } }

        /* ---------- generic card ---------- */
        .card, #setup-screen, #ui-panel, #board-container, #win-box, #turn-popup-box {
            background: var(--card); border: 1px solid rgba(255, 255, 255, .7);
            border-radius: var(--r-lg); box-shadow: var(--shadow);
        }
        h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.01em; }
        button { font-family: var(--font-display); }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

        /* ============================================================
           SETUP SCREEN
           ============================================================ */
        #setup-screen { position: relative; z-index: 1; padding: 30px; max-width: 540px; width: 100%; text-align: center; }
        #setup-screen h1 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 34px); font-weight: 700; }
        #setup-screen .tagline { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group > label { display: block; margin-bottom: 8px; font-weight: 800; font-size: 14px; color: var(--ink); }
        .input-group input, .input-group select {
            width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--r-sm);
            font-size: 16px; background: var(--card-2); color: var(--ink); font-family: var(--font-body);
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent); background: #fff; outline: none; }

        /* player count chips with avatars */
        .chip-row { display: flex; gap: 10px; }
        .chip {
            flex: 1; border: 2px solid var(--line); background: var(--card-2); border-radius: var(--r-md);
            padding: 10px 6px 8px; cursor: pointer; text-align: center; transition: transform .15s ease, border-color .15s, background .15s;
            display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 44px;
        }
        .chip .chip-avatars { font-size: 20px; letter-spacing: -2px; }
        .chip .chip-num { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--muted); }
        .chip:hover { transform: translateY(-2px); }
        .chip[aria-pressed="true"] { border-color: var(--accent); background: #e6f6fd; box-shadow: var(--shadow-sm); }
        .chip[aria-pressed="true"] .chip-num { color: var(--accent-dark); }

        /* difficulty slider */
        .difficulty-wrapper { padding: 0; }
        .difficulty-slider-container { display: flex; flex-direction: column; gap: 6px; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; cursor: pointer; }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 12px; border-radius: 999px;
            background: linear-gradient(90deg, var(--isle-0), var(--isle-3), var(--isle-6), var(--isle-9));
            box-shadow: inset 0 1px 3px rgba(10, 51, 72, .2);
        }
        input[type="range"]::-moz-range-track {
            height: 12px; border-radius: 999px;
            background: linear-gradient(90deg, var(--isle-0), var(--isle-3), var(--isle-6), var(--isle-9));
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 26px; height: 26px; margin-top: -7px; border-radius: 50%;
            background: #fff; border: 3px solid var(--accent); box-shadow: var(--shadow-sm);
        }
        input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
        .difficulty-scale { display: flex; justify-content: space-between; font-size: 16px; padding: 0 4px; }
        .difficulty-label {
            font-family: var(--font-display); font-weight: 700; color: var(--accent-dark); text-align: center;
            font-size: 15px; min-height: 22px; background: #e6f6fd; border-radius: 999px; padding: 4px 12px; align-self: center;
        }

        /* hardcore + settings cards */
        .toggle-card {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid var(--line);
            border-radius: var(--r-md); background: var(--card-2); cursor: pointer; transition: border-color .15s, background .15s;
        }
        .toggle-card:has(input:checked) { border-color: var(--error); background: #fff1ef; }
        .toggle-card input { width: 22px; height: 22px; accent-color: var(--error); cursor: pointer; flex: none; }
        .toggle-card .toggle-text { font-weight: 800; }
        .toggle-card .toggle-hint { font-size: 12px; color: var(--muted); font-weight: 600; }

        button.primary {
            background: linear-gradient(180deg, var(--coral), #f4603c); color: #fff; border: none;
            padding: 15px 24px; border-radius: var(--r-md); font-size: 19px; font-weight: 700; cursor: pointer; width: 100%;
            box-shadow: 0 8px 20px rgba(244, 96, 60, .35); transition: transform .15s ease, box-shadow .15s ease;
        }
        button.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(244, 96, 60, .4); }
        button.primary:active { transform: translateY(0); }
        button.secondary {
            background: var(--card-2); color: var(--ink); border: 2px solid var(--line); padding: 12px 20px;
            border-radius: var(--r-md); font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: background .15s;
        }
        button.secondary:hover { background: #e9f3f8; }

        /* records */
        .rating-block { margin-top: 24px; }
        .rating-block h3 { margin: 0 0 10px; font-size: 17px; }
        #setup-screen .rating-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 8px; text-align: left; }
        #setup-screen .rating-head h3 { margin: 0; font-size: 17px; }
        #rating-table { max-height: 170px; overflow-y: auto; background: var(--card-2); padding: 8px; border-radius: var(--r-md); font-size: 13px; border: 1px solid var(--line); }
        #rating-table table { width: 100%; border-collapse: collapse; }
        #rating-table thead th {
            position: sticky; top: 0; background: var(--card-2); text-align: left; padding: 8px 6px; font-size: 11px;
            text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 2px solid var(--line);
        }
        #rating-table th:nth-child(n+3), #rating-table td:nth-child(n+3) { text-align: center; }
        #rating-table th:nth-child(4), #rating-table td:nth-child(4) { text-align: right; }
        #rating-table tbody tr { border-bottom: 1px solid var(--line); }
        #rating-table tbody tr:nth-child(odd) { background: rgba(255, 255, 255, .7); }
        #rating-table td { padding: 8px 6px; font-weight: 700; }
        #rating-table .medal { font-size: 16px; }
        .badge-hardcore { background: #ffe3df; color: #c0271d; border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 900; }
        .no-rating-text { color: var(--muted); text-align: center; padding: 14px 10px; font-weight: 700; }

        /* ============================================================
           LANGUAGE SWITCHER
           ============================================================ */
        .lang-switch { position: fixed; top: 14px; right: 14px; z-index: 200; }
        .lang-switch.hidden { display: none !important; }
        #lang-select {
            padding: 9px 14px; border-radius: 999px; border: 2px solid rgba(255, 255, 255, .9); font-size: 14px; font-weight: 800;
            cursor: pointer; background: rgba(255, 255, 255, .85); color: var(--ink); box-shadow: var(--shadow-sm);
            font-family: var(--font-display); backdrop-filter: blur(6px);
        }

        /* ============================================================
           GAME SCREEN
           ============================================================ */
        #game-screen {
            position: relative; z-index: 1; display: none; width: 100%; max-width: 1160px;
            grid-template-columns: minmax(0, 1fr) 384px; gap: 24px; align-items: start; justify-content: center;
        }
        #game-screen.on { display: grid; }

        /* ---------- board: a map on the sea ---------- */
        #board-container {
            position: relative; padding: 16px; overflow: hidden;
            background:
                radial-gradient(120% 90% at 50% -10%, rgba(255, 255, 255, .5), transparent 60%),
                linear-gradient(180deg, var(--sea-1) 0%, var(--sea-2) 55%, var(--sea-3) 100%);
            border: 1px solid rgba(255, 255, 255, .5);
        }
        #board-container::after { /* moving light on water */
            content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .35;
            background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.22) 0 2px, transparent 2px 26px);
            animation: water 9s linear infinite;
        }
        @keyframes water { to { transform: translateX(26px); } }

        #start-pad {
            position: relative; z-index: 2; display: flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, .22); border: 2px dashed rgba(255, 255, 255, .75);
            border-radius: 999px; padding: 6px 14px; margin-bottom: 12px; width: max-content;
            color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .04em;
            text-shadow: 0 1px 2px rgba(13, 92, 136, .6);
        }
        #start-pad .boat { font-size: 18px; }
        #start-pad .start-label { text-transform: uppercase; font-size: 12px; letter-spacing: .12em; opacity: .9; }
        #start-pad .cell { width: 34px; height: 34px; flex: none; font-size: 12px; border-color: rgba(255,255,255,.9); }

        #board { position: relative; z-index: 1; display: flex; flex-direction: column-reverse; gap: 10px; width: min(100%, 640px); margin: 0 auto; }
        /* island band: one rounded landmass per row */
        .isle {
            position: relative; z-index: 0; margin: -5px; border-radius: 20px;
            display: flex; gap: 5px; padding: 5px;
            box-shadow: inset 0 -4px 0 rgba(10, 51, 72, .13), 0 3px 10px rgba(13, 92, 136, .28);
        }
        .isle.rev { flex-direction: row-reverse; }
        .isle-flag { position: absolute; top: -3px; right: 2px; font-size: 13px; opacity: .75; }

        .cell {
            position: relative; z-index: 1; flex: 1 1 0; min-width: 0; aspect-ratio: 1 / 1; background: #fff; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            box-shadow: 0 2px 0 rgba(10, 51, 72, .12), inset 0 1px 0 rgba(255, 255, 255, .9);
            font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--ink);
        }
        .cell span.num { z-index: 2; font-size: clamp(9px, 1.6vw, 13px); }
        .cell .isle-tint { position: absolute; inset: 0; border-radius: 10px; opacity: .18; }
        .cell.start-cell { background: #fff; }
        .cell.finish {
            background: linear-gradient(150deg, #fff3cd, #ffd166 60%, #f7b32b); color: #6b4300;
            border: 2px solid #fff; font-size: 15px;
        }
        .cell.finish .num { position: absolute; bottom: 1px; right: 3px; font-size: 9px; opacity: .7; }
        .cell.finish::after { /* treasure shine */
            content: ''; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,.85) 50%, transparent 58%);
            animation: shine 3.4s ease-in-out infinite;
        }
        @keyframes shine { 0%,72% { transform: translateX(-70%) } 100% { transform: translateX(70%) } }
        /* bonus cells: same trophy treatment, their own colors */
        .cell.skip {
            background: linear-gradient(150deg, #e6fcf7, #4cc9f0 55%, #1aa3cc); color: #0a4a5e;
            border: 2px solid #fff; box-shadow: 0 2px 0 rgba(10, 51, 72, .16), inset 0 1px 0 rgba(255, 255, 255, .9);
        }
        .cell.gem {
            background: linear-gradient(150deg, #ffeaf3, #ff9ec4 52%, #ff6fa5); color: #7a1746;
            border: 2px solid #fff; box-shadow: 0 2px 0 rgba(10, 51, 72, .16), inset 0 1px 0 rgba(255, 255, 255, .9);
        }
        .cell-sym {
            font-size: clamp(15px, 2.7vw, 23px); line-height: 1; z-index: 2;
            filter: drop-shadow(0 1px 2px rgba(10, 51, 72, .35));
        }
        .cell.skip .num, .cell.gem .num { position: absolute; bottom: 1px; right: 3px; font-size: 9px; opacity: .75; }
        .cell.skip::after, .cell.gem::after { /* shared shine sweep, offset so they don't blink in sync */
            content: ''; position: absolute; inset: -40%;
            background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .8) 50%, transparent 58%);
            animation: shine 3.4s ease-in-out infinite;
        }
        .cell.skip::after { animation-delay: .6s; }
        .cell.gem::after { animation-delay: 1.5s; }
        .cell.pop { animation: cellPop .5s ease-out; }
        @keyframes cellPop { 0% { transform: scale(1) } 40% { transform: scale(1.16) } 100% { transform: scale(1) } }

        /* ---------- tokens ---------- */
        #tokens-container { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        /* token = position-only shell (JS transform), .token-body hops, .token-animal bobs —
           layered so animations never scale the translate3d position */
        .token {
            position: absolute; top: 0; left: 0; width: 30px; height: 30px; border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 3px 8px rgba(10, 51, 72, .45), inset 0 2px 3px rgba(255, 255, 255, .5), inset 0 -3px 4px rgba(0, 0, 0, .16);
            transition: transform .17s ease-out, width .25s ease, height .25s ease;
            will-change: transform;
        }
        .token-body {
            position: absolute; inset: 0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .token-animal { display: block; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .22)); }
        .token.active { box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 0 0 6px rgba(10, 51, 72, .25), 0 4px 10px rgba(10, 51, 72, .45); }
        .token.hop .token-body { animation: hop .17s ease-out; }
        @keyframes hop { 0% { transform: scale(1, 1) } 30% { transform: scale(.84, 1.16) } 60% { transform: scale(1.1, .9) } 100% { transform: scale(1, 1) } }
        .token.active .token-animal { animation: bob 1.5s ease-in-out infinite; }
        @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-2.5px) } }
        .token.p0 { background: linear-gradient(160deg, #ffc4ad, #ff7a59 55%, #e2593a); }
        .token.p1 { background: linear-gradient(160deg, #a4dcf6, #38a8d8 55%, #1d84b0); }
        .token.p2 { background: linear-gradient(160deg, #82e8c4, #12b886 55%, #0a9268); }
        .token.p3 { background: linear-gradient(160deg, #d9c9ff, #b18cff 55%, #8f66e6); }

        /* floating "+1" and correct/wrong micro-feedback */
        .float-plus {
            position: absolute; z-index: 20; font-family: var(--font-display); font-weight: 900; color: #fff;
            text-shadow: 0 2px 7px rgba(10, 51, 72, .6), 0 0 2px rgba(10, 51, 72, .35); font-size: 21px;
            animation: floatUp 1.8s cubic-bezier(.2, .7, .3, 1) forwards; pointer-events: none;
        }
        /* pop in, hold readable over the landing cell, then drift away */
        /* total rise stays under half a cell so #board-container never clips it on the top row */
        @keyframes floatUp {
            0% { transform: translateY(5px) scale(.6); opacity: 0 }
            14% { transform: translateY(0) scale(1.14); opacity: 1 }
            24% { transform: translateY(-1px) scale(1) }
            66% { transform: translateY(-10px) scale(1); opacity: 1 }
            100% { transform: translateY(-18px) scale(.92); opacity: 0 }
        }

        /* ---------- UI panel ---------- */
        #ui-panel { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        #turn-info {
            display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px;
            background: var(--card-2); border-radius: var(--r-md); border: 1px solid var(--line);
        }
        #turn-info #turn-prefix { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 800; }
        #player-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
        #player-badge {
            padding: 6px 12px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 13px;
            font-family: var(--font-display); box-shadow: var(--shadow-sm); flex: none;
        }
        #hardcore-badge {
            text-align: center; background: linear-gradient(135deg, #ff8a5c, #e8483f); color: #fff; padding: 8px 12px;
            border-radius: var(--r-sm); font-weight: 900; font-size: 13px; letter-spacing: .1em;
            box-shadow: 0 6px 16px rgba(232, 72, 63, .3);
        }
        #mode-badge {
            text-align: center; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; padding: 8px 12px;
            border-radius: var(--r-sm); font-weight: 900; font-size: 13px; letter-spacing: .1em;
            box-shadow: 0 6px 16px rgba(15, 155, 208, .3);
        }

        /* dice + timer ring */
        #dice-wrap { position: relative; width: 108px; height: 108px; margin: 2px auto; }
        #timer-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
        #timer-ring circle { fill: none; stroke-width: 7; }
        #timer-ring .ring-track { stroke: var(--line); }
        #timer-ring .ring-fill { stroke: var(--success); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
        #timer-ring .ring-fill.warn { stroke: var(--gold); }
        #timer-ring .ring-fill.danger { stroke: var(--error); }
        #dice-btn {
            position: absolute; inset: 12px; background: #fff; border: 3px solid var(--line); border-radius: var(--r-md);
            cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm); transition: transform .15s ease, background .15s;
            touch-action: manipulation; user-select: none;
        }
        #dice-btn:hover:not(:disabled) { transform: scale(1.06); background: #f7fcff; }
        #dice-btn:disabled { opacity: .55; cursor: not-allowed; }
        #dice-btn .face { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 46px; height: 46px; }
        #dice-btn .pip { border-radius: 50%; background: transparent; }
        #dice-btn .pip.on { background: var(--ink); box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .35); }
        #dice-btn.tumble .face { animation: tumble .58s cubic-bezier(.3, 1.4, .5, 1); }
        @keyframes tumble {
            0% { transform: rotateX(0) rotateZ(0) scale(1) }
            35% { transform: rotateX(180deg) rotateZ(90deg) scale(.82) }
            70% { transform: rotateX(360deg) rotateZ(180deg) scale(1.12) }
            100% { transform: rotateX(360deg) rotateZ(360deg) scale(1) }
        }
        #timer-label { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; min-height: 16px; }
        #timer-label.danger { color: var(--error); }

        /* problem box */
        #problem-box {
            text-align: center; font-family: var(--font-display); font-size: 26px; font-weight: 700; padding: 14px 12px;
            background: var(--card-2); border: 2px solid var(--line); border-radius: var(--r-md); min-height: 62px;
            display: flex; align-items: center; justify-content: center; transition: background .25s, color .25s, border-color .25s;
        }
        #problem-box.correct { background: var(--success); border-color: var(--success); color: #fff; }
        #problem-box.wrong { background: var(--error); border-color: var(--error); color: #fff; }
        #problem-box.shake { animation: shakeX .4s ease-in-out; }
        @keyframes shakeX { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-7px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }

        /* keypad */
        #keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .kp-btn {
            padding: 14px 0; min-height: 56px; font-size: 22px; font-weight: 700; border: none; border-radius: var(--r-sm);
            background: #eaf3f8; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 #cfE2ec; transition: transform .08s, box-shadow .08s, background .15s;
            touch-action: manipulation; user-select: none;
        }
        .kp-btn:hover { background: #dbeaf3; }
        .kp-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #cfE2ec; }
        .kp-btn.enter { background: var(--success); color: #fff; box-shadow: 0 3px 0 #0d9b72; }
        .kp-btn.enter:active { box-shadow: 0 0 0 #0d9b72; }
        .kp-btn.clear { background: #ffe3df; color: #c0271d; box-shadow: 0 3px 0 #f5bdb6; }
        .kp-btn.clear:active { box-shadow: 0 0 0 #f5bdb6; }
        .kp-btn:disabled { opacity: .4; cursor: not-allowed; }

        /* history */
        #history {
            max-height: 190px; overflow-y: auto; background: var(--card-2); padding: 10px; border-radius: var(--r-md);
            font-size: 13px; line-height: 1.45; border: 1px solid var(--line); scroll-behavior: smooth;
        }
        #history::-webkit-scrollbar { width: 8px; }
        #history::-webkit-scrollbar-thumb { background: #c9dde8; border-radius: 999px; }
        .log-entry {
            display: flex; align-items: center; gap: 8px; padding: 7px 9px; margin-bottom: 6px; border-radius: var(--r-sm);
            border-left: 4px solid var(--success); background: #fff; box-shadow: var(--shadow-sm); font-weight: 700;
        }
        .log-entry.wrong { border-left-color: var(--error); background: #fff1ef; color: #c0271d; }
        .log-entry.bonus { border-left-color: var(--gold); background: #fff8e5; color: #8a5b00; }
        .log-entry.system { border-left-color: #9fb8c6; font-style: italic; color: var(--muted); font-weight: 600; }
        .no-history-text { color: var(--muted); font-weight: 700; padding: 6px 4px; }
        .log-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 1px 3px rgba(10,51,72,.3); }
        .log-answer { margin-left: auto; font-variant-numeric: tabular-nums; }
        #history .log-entry:nth-last-child(n+6) { opacity: .45; }

        /* ============================================================
           OVERLAYS
           ============================================================ */
        .hidden { display: none !important; }
        #confetti-canvas { position: fixed; inset: 0; z-index: 400; pointer-events: none; }

        #win-overlay {
            position: fixed; inset: 0; background: rgba(8, 46, 68, .72); display: flex; align-items: center; justify-content: center;
            z-index: 100; backdrop-filter: blur(6px); padding: 16px;
        }
        #win-box { padding: 32px 28px; text-align: center; animation: pop .35s cubic-bezier(.3, 1.5, .5, 1); max-width: 460px; width: 100%; max-height: 92vh; overflow-y: auto; }
        #win-box h1 { margin: 0 0 4px; font-size: clamp(26px, 6vw, 38px); }
        #win-box h2 { margin: 0 0 10px; font-size: 22px; color: var(--accent-dark); }
        #win-box p { margin: 0 0 14px; color: var(--muted); font-weight: 700; }
                .name-input { width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--r-md); font-size: 16px; font-weight: 700; background: var(--card-2); }
        .name-input:focus { outline: none; border-color: var(--accent); background: #fff; }
        .win-btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .win-btn-row button { flex: 1; margin-top: 0; }
        .stars { font-size: 34px; letter-spacing: 4px; margin-bottom: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
        .stat { background: var(--card-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 6px; }
        .stat .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink); }
        .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
        @keyframes pop { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }

        /* turn popup */
        #turn-popup {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
            z-index: 300; pointer-events: none; opacity: 0; transition: opacity .3s ease;
        }
        #turn-popup.visible { opacity: 1; }
        #turn-popup-bg { position: absolute; inset: 0; background: rgba(8, 46, 68, .5); backdrop-filter: blur(3px); }
        #turn-popup-box {
            position: relative; padding: 26px 44px; text-align: center; box-shadow: var(--shadow-lg);
            animation: popUp .35s cubic-bezier(.3, 1.5, .5, 1); max-width: 90vw;
        }
        @keyframes popUp { from { transform: scale(.7) translateY(14px); opacity: 0 } to { transform: scale(1) translateY(0); opacity: 1 } }
        #turn-popup-box .popup-icon { font-size: 56px; margin-bottom: 6px; }
        #turn-popup-box .popup-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--ink); }
        #turn-popup-box .popup-sub { font-size: 14px; color: var(--muted); margin-top: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 980px) {
            body { align-items: flex-start; padding: 12px 10px 0; }
            #game-screen { grid-template-columns: minmax(0, 1fr); }
            #ui-panel { position: sticky; bottom: 0; z-index: 30; border-radius: var(--r-lg) var(--r-lg) 0 0; box-shadow: var(--shadow-lg); gap: 12px; }
        }
        @media (max-width: 520px) {
            #ui-panel { padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
            #problem-box { font-size: 21px; min-height: 54px; padding: 10px 8px; }
            .kp-btn { min-height: 52px; font-size: 20px; }
            #history { max-height: 110px; }
            #dice-wrap { width: 96px; height: 96px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* ============================================================
           REDUCED MOTION
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
            /* the +X is feedback, not decoration: show it plainly instead of fading it out instantly */
            .float-plus { animation: none; opacity: 1; transform: none; }
        }

    </style>
</head>

            if (code.startsWith('sr')) return 'sr';

    function buildBoard() {

        board.innerHTML = '';
        const totalCells = state.boardSize;          // 10 cells per island
        const rows = Math.ceil(totalCells / 10);
        const ISLE_FLAGS = ['🥥', '🌋', '🌺', '🗿', '🦀', '⛵', '🐚', '🌴', '🔥', '👑'];

        for (let r = 0; r < rows; r++) {
            const isle = document.createElement('div');
            isle.className = 'isle' + (r % 2 === 1 ? ' rev' : '');
            isle.style.background = ISLAND_COLORS[Math.min(r, ISLAND_COLORS.length - 1)];
            const flag = document.createElement('span');
            flag.className = 'isle-flag';
            flag.textContent = ISLE_FLAGS[r % ISLE_FLAGS.length];
            isle.appendChild(flag);

            for (let i = r * 10 + 1; i <= Math.min((r + 1) * 10, totalCells); i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                if (i === totalCells) {
                    cell.classList.add('finish');
                    cell.innerHTML = `🏆<span class="num">${i}</span>`;
                } else {
                    const offset = i % 10;
                    if (offset === 3) {
                        cell.classList.add('skip');
                        cell.innerHTML = `<span class="cell-sym">⏳</span><span class="num">${i}</span>`;
                    } else if (offset === 7) {
                        cell.classList.add('gem');
                        cell.innerHTML = `<span class="cell-sym">💎</span><span class="num">${i}</span>`;
                    } else {
                        cell.innerHTML = `<span class="num">${i}</span>`;
                    }
                }
                isle.appendChild(cell);
            }
            board.appendChild(isle);
        }
        translatePage();
    }

    const ANIMALS = ['🦁', '🐯', '🦊', '🐼'];
    // cluster patterns as fractions of token size; token auto-shrinks so the group fits one cell
    const CLUSTER = {
        2: [[-0.46, 0], [0.46, 0]],
        3: [[-0.46, 0.34], [0.46, 0.34], [0, -0.48]],
        4: [[-0.46, -0.46], [0.46, -0.46], [-0.46, 0.46], [0.46, 0.46]]
    };

    function createTokens() {
        const container = document.getElementById('tokens-container'); container.innerHTML = '';
        state.players.forEach((_, i) => {
            const t = document.createElement('div'); t.className = `token p${i}`; t.id = `token-${i}`;
            t.innerHTML = `<span class="token-body"><span class="token-animal">${ANIMALS[i % ANIMALS.length]}</span></span>`;
            t.setAttribute('aria-label', state.players[i]);
            container.appendChild(t); moveTokenTo(i, 0, false);
        });
    }

    function positionToken(playerIdx) {
        const token = document.getElementById(`token-${playerIdx}`);
        const pos = Math.min(state.positions[playerIdx], state.boardSize);
        const cell = document.getElementById(`cell-${pos}`);
        if (!token || !cell) return;
        const rect = cell.getBoundingClientRect();
        const boardRect = document.getElementById('board-container').getBoundingClientRect();
        const peers = [];
        state.players.forEach((_, i) => { if (Math.min(state.positions[i], state.boardSize) === pos) peers.push(i); });
        const n = peers.length, my = peers.indexOf(playerIdx);
        const cellW = rect.width || 40;
        const scale = n === 1 ? 0.8 : n === 2 ? 0.5 : 0.46;
        const size = Math.max(15, Math.min(32, cellW * scale));
        token.style.width = size.toFixed(1) + 'px';
        token.style.height = size.toFixed(1) + 'px';
        token.style.fontSize = (size * 0.56).toFixed(1) + 'px';
        let dx = 0, dy = 0;
        if (n >= 2) { const pat = CLUSTER[Math.min(n, 4)][my % 4]; dx = pat[0] * size; dy = pat[1] * size; }
        const x = rect.left - boardRect.left + rect.width / 2 - size / 2 + dx;
        const y = rect.top - boardRect.top + rect.height / 2 - size / 2 + dy;
        token.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
        token.style.zIndex = state.currentPlayer === playerIdx ? 14 : 10 + my;
    }

    const tokenAnim = { timers: [], ms: 0 };
    function moveTokenTo(playerIdx, targetPos, animate = true) {
        tokenAnim.timers.forEach(clearTimeout); tokenAnim.timers = [];
        const from = state.positions[playerIdx];
        if (!animate || targetPos === from) {
            state.positions[playerIdx] = targetPos;
            state.players.forEach((_, i) => positionToken(i));
            tokenAnim.ms = 0; return;
        }
        const STEP = 170, dir = Math.sign(targetPos - from);
        tokenAnim.ms = Math.abs(targetPos - from) * STEP;
        let i = from;
        const tick = () => {
            i += dir;
            state.positions[playerIdx] = i;
            positionToken(playerIdx);
            const token = document.getElementById(`token-${playerIdx}`);
            if (token) { token.classList.remove('hop'); void token.offsetWidth; token.classList.add('hop'); }
            if (i !== targetPos) tokenAnim.timers.push(setTimeout(tick, STEP));
            else state.players.forEach((_, j) => positionToken(j));
        };
        tokenAnim.timers.push(setTimeout(tick, STEP));
    }

    window.addEventListener('resize', () => {
        if (state.players && state.players.length) state.players.forEach((_, i) => positionToken(i));

    const PIP_MAP = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    function setDiceFace(n) {
        const pips = document.querySelectorAll('#dice-btn .pip');
        const on = PIP_MAP[n] || PIP_MAP[1];
        pips.forEach((p, idx) => p.classList.toggle('on', on.includes(idx)));
    }

    function rollDice() {
        if (state.isRolling || state.isAnswering) return;

        state.isRolling = true; const btn = document.getElementById('dice-btn');
        btn.classList.remove('tumble'); void btn.offsetWidth; btn.classList.add('tumble'); btn.disabled = true;
        document.getElementById('problem-box').textContent = t('dice_roll');
        document.getElementById('problem-box').className = '';

        setTimeout(() => {
            state.diceResult = Math.floor(Math.random() * 6) + 1;
            btn.classList.remove('tumble'); setDiceFace(state.diceResult); state.isRolling = false;
            const target = Math.min(state.positions[state.currentPlayer] + state.diceResult, state.boardSize);
            document.getElementById('problem-box').textContent = `${t('dice_prefix')} ${state.diceResult} ➜ ${t('coordinate_prefix')} ${target}`;
            setTimeout(startAnswerPhase, 600);
        }, 600);
    }

        // Dynamic level calculation based on board size
    function getIslandLevelDynamic(cell) {
        const levelSize = 10;
        const maxLevel = state.difficulty;
        const maxCell = state.boardSize;

        if (cell <= 0) return 0;
        if (cell >= maxCell) return Math.min(maxLevel, 9); // Finish
        return Math.min(Math.floor((cell - 1) / levelSize), maxLevel - 1);
    }

    function generateProblem(cell) {
        const level = getIslandLevelDynamic(cell);
        // Division drills the inverse of the same island table, so both modes share one progression.
        if (state.mode === 'div') return generateDivisionProblem(level);
        return generateMultiplicationProblem(level);
    }

    function generateMultiplicationProblem(level) {
        let a, b;
        switch(level) {
            case 0: { // ×0, ×1, ×10 → ×10, ×11, ×20 in hardcore
                const t = Math.random();
                const num = rand(1, 9);
                if (t < 0.33) {
                    if (state.hardcore) return {q: `${num} × 10 = ?`, ans: num * 10};
                    return {q: `${num} × 0 = ?`, ans: 0};
                }
                if (t < 0.66) {
                    if (state.hardcore) return {q: `${num} × 11 = ?`, ans: num * 11};
                    return {q: `${num} × 1 = ?`, ans: num};
                }
                if (state.hardcore) return {q: `${num} × 20 = ?`, ans: num * 20};
                return {q: `${num} × 10 = ?`, ans: num * 10};
            }
            case 1: a = 2; b = rand(2, 9); break;
            case 2: a = 3; b = rand(3, 9); break;
            case 3: a = Math.random() > 0.5 ? 4 : 5; b = rand(3, 9); break;
            case 4: a = 6; b = rand(4, 9); break;
            case 5: a = 7; b = rand(4, 9); break;
            case 6: a = 8; b = rand(5, 9); break;
            case 7: a = 9; b = rand(5, 9); break;
            case 8: a = rand(3, 7); b = rand(3, 7); break;
            case 9: // Hard/Reverse
                a = rand(4, 9); b = rand(4, 9);
                if (state.hardcore) a += 10;
                if (Math.random() > 0.5) return {q: `? × ${b} = ${a*b}`, ans: a};
                return {q: `${a*b} : ${a} = ?`, ans: b};
        }
        if (state.hardcore) a += 10;
        return Math.random() > 0.5 ? {q: `${a} × ${b} = ?`, ans: a*b} : {q: `${b} × ${a} = ?`, ans: a*b};
    }

    // Island N divides by N+1, the inverse of the ×(N+1) table the same island drills in
    // multiplication mode, so one difficulty slider drives both.
    function generateDivisionProblem(level) {
        let d, q;
        switch(level) {
            case 0: {
                // Opening island is exact-only: ×0 has no inverse, and a divisor of 1 can
                // never leave a remainder, so a remainder form here would be unanswerable.
                const roll = Math.random();
                const num = rand(1, 9);
                if (state.hardcore) {
                    if (roll < 0.33) return {q: `${num * 10} ÷ 10 = ?`, ans: num};
                    if (roll < 0.66) return {q: `${num * 11} ÷ 11 = ?`, ans: num};
                    return {q: `${num * 20} ÷ 20 = ?`, ans: num};
                }
                if (roll < 0.5) return {q: `${num} ÷ 1 = ?`, ans: num};
                return {q: `${num * 10} ÷ 10 = ?`, ans: num};
            }
            case 1: d = 2; q = rand(2, 9); break;
            case 2: d = 3; q = rand(3, 9); break;
            case 3: d = Math.random() > 0.5 ? 4 : 5; q = rand(3, 9); break;
            case 4: d = 6; q = rand(4, 9); break;
            case 5: d = 7; q = rand(4, 9); break;
            case 6: d = 8; q = rand(5, 9); break;
            case 7: d = 9; q = rand(5, 9); break;
            case 8: d = rand(3, 7); q = rand(3, 7); break;
            case 9: // Hard/Reverse
                d = rand(4, 9); q = rand(4, 9);
                if (state.hardcore) d += 10;
                if (Math.random() > 0.5) return {q: `? ÷ ${d} = ${q}`, ans: d * q};
                return {q: `${d * q} ÷ ${q} = ?`, ans: d};
        }
        if (state.hardcore) d += 10;
        const product = d * q;
        // Ask for the quotient, or give the quotient and ask for the remainder. Either way
        // the answer is one number, so the keypad, input cap and grading stay mode-agnostic.
        if (Math.random() < 0.5) return {q: `${product} ÷ ${d} = ?`, ans: q};
        const r = rand(1, d - 1); // a remainder is always strictly between 0 and the divisor
        return {q: `${product + r} ÷ ${d} = ${q} ${t('remainder_word')} ?`, ans: r};
    }

    function resetTurnUI() {
        // Bring dice/keypad/problem box back to the "waiting for roll" state.
        // The winning answer returns early from submitAnswer(), so without this
        // the dice would stay disabled on the next game.
        clearInterval(state.timerInterval);
        state.isRolling = false;
        state.isAnswering = false;
        state.currentProblem = null;
        state.inputBuffer = "";
        const keypad = document.getElementById('keypad');
        if (keypad) keypad.classList.add('hidden');
        document.querySelectorAll('.kp-btn').forEach(b => b.disabled = false);
        const dice = document.getElementById('dice-btn');
        if (dice) { dice.disabled = false; dice.classList.remove('tumble'); }
        const pb = document.getElementById('problem-box');
        if (pb) { pb.className = ''; pb.textContent = t('dice_roll'); }
        setDiceFace(1);
        clearTimerLabel();
    }

    function startAnswerPhase() {
        state.isAnswering = true;
        const target = Math.min(state.positions[state.currentPlayer] + state.diceResult, state.boardSize);
        state.currentProblem = generateProblem(target);

        document.getElementById('problem-box').textContent = state.currentProblem.q;
        document.getElementById('keypad').classList.remove('hidden');
        document.getElementById('dice-btn').disabled = true;
        document.querySelectorAll('.kp-btn').forEach(b => b.disabled = false);
        state.inputBuffer = "";
        startTimer();
    }

    function startTimer() {
        clearInterval(state.timerInterval);
        state.timerLeft = state.timerDuration; updateTimerBar();
        state.timerInterval = setInterval(() => {
            state.timerLeft--; updateTimerBar();
            if (state.timerLeft <= 0) { clearInterval(state.timerInterval); submitAnswer(true); }
        }, 1000);
    }

    const RING_C = 307.9;
    function clearTimerLabel() {
        const label = document.getElementById('timer-label');
        if (label) { label.textContent = ''; label.classList.remove('danger'); }
        const ring = document.getElementById('ring-fill');
        if (ring) { ring.classList.remove('warn', 'danger'); }
    }
    function updateTimerBar() {
        const pct = state.timerLeft / state.timerDuration;
        const ring = document.getElementById('ring-fill');
        if (ring) {
            ring.style.strokeDashoffset = (RING_C * (1 - pct)).toFixed(1);
            ring.classList.toggle('warn', pct <= 0.5 && pct > 0.25);
            ring.classList.toggle('danger', pct <= 0.25);
        }
        const label = document.getElementById('timer-label');
        if (label) {
            label.textContent = `⏱ ${state.timerLeft}s`;
            label.classList.toggle('danger', state.timerLeft <= 3);
        }
    }

    function typeNum(n) { if (state.isAnswering && state.inputBuffer.length < 3) { state.inputBuffer += n; showInput(); } }
    function clearInput() { if (!state.isAnswering) return; state.inputBuffer = state.inputBuffer.slice(0, -1); showInput(); }
    function showInput() { document.getElementById('problem-box').textContent = `${state.currentProblem ? state.currentProblem.q : ''} ${state.inputBuffer}`; }

    function handleKeyboardInput(event) {
        // Don't intercept keyboard input when win-overlay is open (rating input)
        if (!document.getElementById('win-overlay').classList.contains('hidden')) {
            return;
        }

        const isSpaceKey = event.key === ' ' || event.code === 'Space';
        if (!state.isAnswering) {
            if (isSpaceKey && !state.isRolling) {
                event.preventDefault();
                rollDice();
            }
            return;
        }

        if (event.key === 'Enter') {
            event.preventDefault();
            submitAnswer();
            return;
        }
        if (event.key === 'Backspace' || event.key === 'Delete') {
            event.preventDefault();
            clearInput();
            return;
        }
        if (/^[0-9]$/.test(event.key)) {
            event.preventDefault();
            typeNum(Number(event.key));
        }
    }

    function spawnFloat(cellPos, text) {
        const cell = document.getElementById(`cell-${Math.min(cellPos, state.boardSize)}`);
        const container = document.getElementById('tokens-container');
        if (!cell || !container) return;
        const rect = cell.getBoundingClientRect();
        const bRect = document.getElementById('board-container').getBoundingClientRect();
        const el = document.createElement('div');
        el.className = 'float-plus'; el.textContent = text;
        el.style.left = (rect.left - bRect.left + rect.width / 2 - 14) + 'px';
        el.style.top = (rect.top - bRect.top + rect.height / 2 - 12) + 'px';
        container.appendChild(el);
        // keep it mounted for the full 1.8s of the CSS animation
        setTimeout(() => el.remove(), 1850);
    }

    function launchConfetti(duration = 2800) {
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const canvas = document.getElementById('confetti-canvas');
        if (!canvas) return;
        canvas.classList.remove('hidden');
        const ctx = canvas.getContext('2d');
        canvas.width = innerWidth; canvas.height = innerHeight;
        const colors = ['#ff7a59', '#ffd166', '#4cc9f0', '#12b886', '#b18cff', '#ff7a9c'];
        const parts = Array.from({ length: 150 }, () => ({
            x: Math.random() * canvas.width, y: -20 - Math.random() * canvas.height * 0.6,
            w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
            c: colors[Math.floor(Math.random() * colors.length)],
            vy: 2 + Math.random() * 3.4, vx: -1 + Math.random() * 2,
            rot: Math.random() * Math.PI, vr: -0.1 + Math.random() * 0.2
        }));
        const t0 = performance.now();
        (function frame(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            parts.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.rot += p.vr;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
            });
            if (now - t0 < duration) requestAnimationFrame(frame);
            else { ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.classList.add('hidden'); }
        })(t0);
    }

    function submitAnswer(timeout = false) {
        if (!state.isAnswering) return;
        const answerTime = state.timerDuration - state.timerLeft;
        state.playerTime[state.currentPlayer] += answerTime;
        clearInterval(state.timerInterval); state.isAnswering = false;
        document.querySelectorAll('.kp-btn').forEach(b => b.disabled = true);

        const userAns = parseInt(state.inputBuffer);
        const correct = state.currentProblem.ans;
        const isCorrect = !timeout && userAns === correct;
        const startPos = state.positions[state.currentPlayer];
        const target = Math.min(startPos + state.diceResult, state.boardSize);
        const pName = state.players[state.currentPlayer];

        const histHtml = `<span class="log-dot" style="background:${COLORS[state.currentPlayer]}"></span><span>🎲${state.diceResult} · ${startPos}→${target}</span><span class="log-answer">${timeout ? '⏱' : (isNaN(userAns) ? '—' : userAns)} ${isCorrect ? '✅' : '❌'}</span>`;

        if (isCorrect) {
            document.getElementById('problem-box').className = 'correct';
            document.getElementById('problem-box').textContent = t('correct');
            logHistoryHtml(histHtml);
            state.correctCount++;
            moveTokenTo(state.currentPlayer, target);
            const landed = '+' + (target - startPos);
            setTimeout(() => spawnFloat(target, landed), tokenAnim.ms);
            checkBonuses(target);

            // Increment turn count for this player (on successful answer)
            state.playerTurns[state.currentPlayer]++;

            if (target >= state.boardSize) { setTimeout(checkWin, Math.max(600, tokenAnim.ms + 400)); return; }
            if (state.extraTurn[state.currentPlayer]) {
                state.extraTurn[state.currentPlayer] = false;
                logBonus(`${t('bonus_token')} ${pName}!`);
                setTimeout(endTurnPhase, 800);
            } else { setTimeout(nextTurn, 1000); }
        } else {
            { const pb = document.getElementById('problem-box'); pb.className = 'wrong'; void pb.offsetWidth; pb.className = 'wrong shake'; }
            document.getElementById('problem-box').textContent = timeout ? `${t('time_out')} ${t('correct_answer_prefix')} ${correct}` : `❌ ${t('correct_answer_prefix')} ${correct}`;
            logHistoryHtml(histHtml, 'wrong');
            state.wrongCount++;
            setTimeout(nextTurn, 1500);
        }

        document.getElementById('keypad').classList.add('hidden');
        document.getElementById('dice-btn').disabled = false;
        setDiceFace(1); clearTimerLabel();
    }

    function checkBonuses(cell) {
        const offset = cell % 10;
        if (offset === 3) { state.skipNext[state.currentPlayer] = true; logBonus(`⏳ ${state.players[state.currentPlayer]} ${t('skip_token')}`); }
        if (offset === 7) { state.extraTurn[state.currentPlayer] = true; logBonus(`💎 ${state.players[state.currentPlayer]} ${t('bonus_extra_turn')}`); }
    }

    function nextTurn() {
        state.currentPlayer = (state.currentPlayer + 1) % state.players.length;
        updateUI();
        showTurnPopup('🎮', `${state.players[state.currentPlayer]}`, t('turn_prefix'));

        // If the next player must skip their turn - skip immediately
        if (state.skipNext[state.currentPlayer]) {
            state.skipNext[state.currentPlayer] = false;
            logSystem(`⏳ ${state.players[state.currentPlayer]} ${t('skip_turn')}`);
            showTurnPopup('⏳', `${state.players[state.currentPlayer]}`, t('skip_turn'));
            setTimeout(nextTurn, 1500);
        }
    }
    function endTurnPhase() { document.getElementById('keypad').classList.add('hidden'); document.getElementById('dice-btn').disabled = false; setDiceFace(1); clearTimerLabel(); updateUI(); showTurnPopup('🔄', `${state.players[state.currentPlayer]}`, t('turn_prefix')); }

    function updateUI() {
        const pIdx = state.currentPlayer;
        document.getElementById('player-name').textContent = state.players[pIdx];
        document.getElementById('turn-prefix').textContent = t('turn_prefix');
        document.getElementById('player-badge').textContent = `P${pIdx + 1}`;
        document.getElementById('player-badge').style.background = COLORS[pIdx];
        document.querySelectorAll('.token').forEach((t, i) => t.classList.toggle('active', i === pIdx));

        // Show/hide hardcore badge
        document.getElementById('hardcore-badge').classList.toggle('hidden', !state.hardcore);

        // Show which operation this game is drilling; multiplication is the default
        // setting, so its badge would be noise and only division is announced.
        const modeBadge = document.getElementById('mode-badge');
        if (modeBadge) {
            modeBadge.classList.toggle('hidden', state.mode !== 'div');
            modeBadge.textContent = `➗ ${t('mode_div')}`;
        }
    }

    function showTurnPopup(icon, text, sub) {
        const popup = document.getElementById('turn-popup');
        document.getElementById('popup-icon').textContent = icon;
        document.getElementById('popup-text').textContent = text;
        document.getElementById('popup-sub').textContent = sub || '';
        popup.classList.add('visible');
        clearTimeout(popup._timeout);
        popup._timeout = setTimeout(() => { popup.classList.remove('visible'); }, 1800);
    }

    function renderRating() {
        const rating = loadRating();
        const box = document.getElementById('rating-table');
        if (rating.length === 0) {
            box.innerHTML = `<div class="no-rating-text">${t('no_ratings')}</div>`;
            return;
        }
        let html = `<table><thead><tr><th>${t('placman')}</th><th>${t('player')}</th><th>${t('difficulty')}</th><th>${t('time')}</th><th>${t('moves')}</th><th>${t('players')}</th></tr></thead><tbody>`;
        rating.slice(0, 10).forEach((entry, i) => {
            const place = ['🥇', '🥈', '🥉'][i] || (i + 1);
            // Entries saved before the mode switch predate division, so absent mode is multiplication.
            const mode = entry.mode === 'div' ? 'div' : 'mul';
            let diff = `${mode === 'div' ? '➗' : '✖️'} ${entry.difficulty ? entry.difficulty : '3'}`;
            if (entry.hardcore) diff += ' <span class="badge-hardcore">H</span>';
            const moves = entry.turns ? entry.turns.reduce((a, b) => a + b, 0) : '-';
            html += `<tr><td class="medal">${place}</td><td>${entry.name}</td><td>${diff}</td><td>${entry.time}s</td><td>${moves}</td><td>${entry.players}</td></tr>`;
        });
        html += '</tbody></table>';
        box.innerHTML = html;
    }

    function checkWin() {
        const totalTime = state.playerTime.reduce((a, b) => a + b, 0);
        const winnerName = state.players[state.currentPlayer];
        const moves = state.playerTurns.reduce((a, b) => a + b, 0);
        const answered = state.correctCount + state.wrongCount;
        const acc = answered ? Math.round(100 * state.correctCount / answered) : 100;
        const stars = acc >= 80 ? '⭐⭐⭐' : acc >= 55 ? '⭐⭐' : '⭐';
        launchConfetti();
        document.getElementById('win-box').innerHTML = `
            <h1 data-i18n="win_title"></h1>
            <div class="stars" aria-hidden="true">${stars}</div>
            <h2>🥇 ${winnerName}</h2>
            <p>${t('islands_conquered')}</p>
            <div class="stats-grid">
                <div class="stat"><div class="v">${totalTime}s</div><div class="k">${t('total_time').replace(':','')}</div></div>
                <div class="stat"><div class="v">${moves}</div><div class="k">${t('moves')}</div></div>
                <div class="stat"><div class="v">${acc}%</div><div class="k">${t('accuracy')}</div></div>
            </div>
            <div class="input-group">
                <input type="text" class="name-input" id="winner-name-input" placeholder="${t('winner_name_placeholder')}">
            </div>
            <button class="primary" onclick="saveAndShowRating()" data-i18n="save_rating"></button>
            <div class="win-btn-row">
                <button class="primary" onclick="playAgain()" data-i18n="restart_button"></button>
                <button class="secondary" onclick="backToMenu()" data-i18n="menu_label"></button>
            </div>
        `;
        translatePage();
        document.getElementById('win-overlay').classList.remove('hidden');
        document.getElementById('winner-name-input').focus();
    }

    function saveAndShowRating() {
        const name = document.getElementById('winner-name-input').value.trim() || t('anonymous');
        const totalTime = state.playerTime.reduce((a, b) => a + b, 0);
        addRatingEntry(name, totalTime, state.players.length);
        document.getElementById('win-overlay').classList.add('hidden');
        resetTurnUI();
        renderRating();
        document.getElementById('setup-screen').style.display = 'block';
        document.getElementById('game-screen').style.display = 'none';
        // Re-enable language switcher on setup screen
        document.querySelector('.lang-switch').classList.remove('hidden');
    }

    function playAgain() {
        document.getElementById('win-overlay').classList.add('hidden');
        document.getElementById('history').innerHTML = '';
        resetTurnUI();
        startGame();
    }

    function backToMenu() {
        document.getElementById('win-overlay').classList.add('hidden');
        resetTurnUI();
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'block';
        document.querySelector('.lang-switch').classList.remove('hidden');
        renderRating();
    }

    function logHistory(text, type) {
        const box = document.getElementById('history');
        if (box.children[0]?.classList.contains('system')) box.innerHTML = '';
        const entry = document.createElement('div');
        entry.className = `log-entry ${type === 'wrong' ? 'wrong' : type === 'bonus' ? 'bonus' : ''}`;
        entry.textContent = text; box.appendChild(entry); box.scrollTop = box.scrollHeight;
    }
    function logHistoryHtml(html, cls) {
        const box = document.getElementById('history');
        if (box.children[0]?.classList.contains('system')) box.innerHTML = '';
        const entry = document.createElement('div');
        entry.className = `log-entry ${cls || ''}`;
        entry.innerHTML = html;
        box.appendChild(entry); box.scrollTop = box.scrollHeight;
    }
    function logBonus(text) { logHistory(text, 'bonus'); }
    function logSystem(text) {
        const box = document.getElementById('history');
        if (box.children[0]?.classList.contains('system')) box.innerHTML = '';
        const entry = document.createElement('div'); entry.className = 'log-entry system'; entry.textContent = text; box.appendChild(entry);
    }

    // Initialize language on page load
    document.addEventListener('DOMContentLoaded', () => {
        const savedLang = getCurrentLang();
        document.getElementById('lang-select').value = savedLang;
        document.documentElement.lang = savedLang;
        translatePage();
        renderRating();
        updateDifficultyLabel(); // Initialize difficulty label on load
        setDiceFace(1); clearTimerLabel();
        document.addEventListener('keydown', handleKeyboardInput);
    });
</script>
</body>
</html>
